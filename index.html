            cursor: pointer; border: 0;

        .btn:active { transform: scale(.98); }

            color: #fff; box-shadow: 0 10px 24px rgba(109,93,252,.30);

        .btn-out { background: #fff; color: var(--ink2); border: 1px solid var(--line); }
